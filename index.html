<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N-V-D-A · Eleven Days</title>
<style>
  :root { --gold:#ffd54a; --bg:#08080b; --line:#1b1b22; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--bg); color:#d6d6de;
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%; overscroll-behavior:none;
    min-height:100dvh; display:flex; flex-direction:column;
  }

  header {
    flex:0 0 auto; padding:12px 20px; display:flex; align-items:baseline;
    justify-content:space-between; border-bottom:1px solid var(--line);
  }
  header h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:.5px; }
  header h1 em { color:#54545f; font-style:normal; font-weight:400; margin-left:8px; }
  header .meta { font-size:12px; color:#4e4e58; font-variant-numeric:tabular-nums; }

  main { flex:1 1 auto; min-height:0; display:grid; grid-template-columns:minmax(0,62%) minmax(0,38%); }

  /* 左：视频 */
  .stage {
    display:flex; align-items:center; justify-content:center;
    padding:18px; background:#000; border-right:1px solid var(--line);
  }
  .frame { width:100%; max-width:1120px; aspect-ratio:16/9; background:#000 url(poster.jpg) center/cover no-repeat; border-radius:10px; overflow:hidden; }
  video { width:100%; height:100%; display:block; object-fit:contain; background:transparent; outline:none; }

  /* 右：字幕 */
  .lyrics { position:relative; min-height:0; overflow:hidden; }
  .list {
    height:100%; overflow-y:auto; padding:38vh 0 40vh;
    scrollbar-width:thin; scroll-behavior:smooth;
  }
  .list::-webkit-scrollbar { width:6px; }
  .list::-webkit-scrollbar-thumb { background:#26262e; border-radius:3px; }

  .line { padding:9px 22px; border-left:3px solid transparent; transition:background .18s; }
  .en { font-size:13px; color:#5d5d68; line-height:1.45; transition:color .18s; }
  .zh { font-size:19px; color:#c2c2cc; line-height:1.4; margin-top:2px; transition:color .18s; }

  .line.on { border-left-color:var(--gold); background:linear-gradient(90deg,rgba(255,213,74,.08),transparent 72%); }
  .line.on .zh { color:var(--gold); font-weight:600; }
  .line.on .en { color:#a2946a; }

  /* 手机竖屏：上下排列 */
  @media (max-width: 860px), (orientation: portrait) and (max-width: 1024px) {
    main { display:flex; flex-direction:column; }
    .stage { padding:0; border-right:none; border-bottom:1px solid var(--line); flex:0 0 auto; }
    .frame { max-width:none; border-radius:0; }
    .lyrics { flex:1 1 auto; min-height:34vh; }
    .list { padding:16px 0 30px; }
    .line { padding:7px 16px; }
    .en { font-size:11.5px; }
    .zh { font-size:16.5px; }
    header { padding:10px 14px; }
    header h1 { font-size:13px; }
    header h1 em { display:none; }
  }
</style>
</head>
<body>

<header>
  <h1>N-V-D-A<em>Eleven Days</em></h1>
  <div class="meta"><span id="pos">0:00</span> / 3:26</div>
</header>

<main>
  <section class="stage">
    <div class="frame">
      <video id="v" src="mv.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
    </div>
  </section>

  <section class="lyrics">
    <div class="list" id="list"></div>
  </section>
</main>

<script>
const LYR = [{"t": 15.56, "en": "Huang man there's no need to feel down", "zh": "黄老板，不必感到沮丧"}, {"t": 18.37, "en": "I said Huang man lose the leather and go", "zh": "我说，黄老板，皮衣脱了，走吧"}, {"t": 22.13, "en": "I said Huang man your conduct broke the code", "zh": "我说，黄老板，你的品行违了《行为准则》"}, {"t": 25.85, "en": "There's no need to be unhappy", "zh": "没必要闷闷不乐"}, {"t": 30.33, "en": "Huang man there's a place you can go", "zh": "黄老板，有个地方你可以去"}, {"t": 33.37, "en": "I said Huang man though you're not short on dough", "zh": "我说，黄老板，虽然你根本不缺钱"}, {"t": 37.13, "en": "You can stay there and I'm sure you will find", "zh": "你可以待在那里，我保证你会发现"}, {"t": 40.85, "en": "Fingers point at you in no time", "zh": "你很快就会被千夫所指"}, {"t": 43.8, "en": "It's hell to be out of the N-V-D-A", "zh": "不在英伟达，日子就是地狱"}, {"t": 47.49, "en": "It's hell to be out of the N-V-D-A", "zh": "不在英伟达，日子就是地狱"}, {"t": 52.73, "en": "The ticker is down thirty percent enjoy", "zh": "股价跌了三成，请慢用"}, {"t": 56.25, "en": "You can't hang out with all the boys", "zh": "你不能和兄弟们一起玩了"}, {"t": 58.89, "en": "It's hell to be out of the N-V-D-A", "zh": "不在英伟达，日子就是地狱"}, {"t": 62.65, "en": "It's hell to be out of the N-V-D-A", "zh": "不在英伟达，日子就是地狱"}, {"t": 67.61, "en": "You can't get yourself cleared you can't have a good meal", "zh": "你洗不清罪责，你也吃不上好饭"}, {"t": 71.37, "en": "You can't do whatever you feel", "zh": "你想干什么都不行"}, {"t": 75.92, "en": "Huang man are you listening to me", "zh": "黄老板，你在听我说吗？"}, {"t": 78.69, "en": "I said Huang man one call and you're on board", "zh": "我说，黄老板，我一个电话你就归队"}, {"t": 82.45, "en": "I said Huang man you're the whole treasury", "zh": "我说，黄老板，你一个人就是整座国库"}, {"t": 86.25, "en": "But you've got to know this one thing", "zh": "但你得明白一件事"}, {"t": 90.69, "en": "No board does it all by itself", "zh": "没有哪个董事会能单靠自己"}, {"t": 93.77, "en": "I said board men put your pride on the shelf", "zh": "我说，董事们，把你们的骄傲放一放"}, {"t": 97.57, "en": "And just go there to the N-V-D-A", "zh": "就去那个地方，去 N-V-D-A"}, {"t": 101.29, "en": "I'm sure they'll do just what I say", "zh": "我保证他们照我说的做"}, {"t": 104.36, "en": "It's fun to stay at the N-V-D-A", "zh": "待在英伟达，日子多快乐"}, {"t": 108.01, "en": "It's fun to stay at the N-V-D-A", "zh": "待在英伟达，日子多快乐"}, {"t": 113.25, "en": "The ticker's up thirty-one percent enjoy", "zh": "股价涨了三十一个点，请慢用"}, {"t": 116.81, "en": "You can hang out with all the boys", "zh": "你可以和兄弟们一起玩了"}, {"t": 119.37, "en": "It's fun to stay at the N-V-D-A", "zh": "待在英伟达，日子多快乐"}, {"t": 123.13, "en": "It's fun to stay at the N-V-D-A", "zh": "待在英伟达，日子多快乐"}, {"t": 128.09, "en": "You can get yourself cleared you can have a good meal", "zh": "你洗清了罪责，你吃得上好饭"}, {"t": 131.85, "en": "You can do whatever you feel", "zh": "你想干什么都行"}, {"t": 136.4, "en": "Huang man they all say they've been in your shoes", "zh": "黄老板，他们都说自己也曾坐在你那个位置上"}, {"t": 139.17, "en": "I said they never were I had the blues", "zh": "我说，他们从来没有——我当年才是真落魄"}, {"t": 142.93, "en": "I felt no one cared if I was alive", "zh": "我觉得没人在乎我是不是还活着"}, {"t": 146.69, "en": "I felt both parties were so jive", "zh": "我觉得两党都是一个样，全是演的"}, {"t": 151.17, "en": "That's when the White House called on me", "zh": "就在那时，白宫给我打来了电话"}, {"t": 154.25, "en": "And said Huang man take a walk up the street", "zh": "说，黄老板，沿街走上去"}, {"t": 158.01, "en": "There's a place there called the N-V-D-A", "zh": "那里有个地方，叫 N-V-D-A"}, {"t": 161.77, "en": "They can start you back on your way", "zh": "他们能让你重新上路"}, {"t": 164.96, "en": "It's fun to stay at the N-V-D-A", "zh": "待在英伟达，日子多快乐"}, {"t": 168.37, "en": "It's fun to stay at the N-V-D-A", "zh": "待在英伟达，日子多快乐"}, {"t": 173.61, "en": "The ticker's up thirty-one percent enjoy", "zh": "股价涨了三十一个点，请慢用"}, {"t": 177.13, "en": "You can hang out with all the boys", "zh": "你可以和兄弟们一起玩了"}, {"t": 179.85, "en": "It's fun to stay at the N-V-D-A", "zh": "待在英伟达，日子多快乐"}, {"t": 183.45, "en": "It's fun to stay at the N-V-D-A", "zh": "待在英伟达，日子多快乐"}, {"t": 188.41, "en": "You can get yourself cleared you can have a good meal", "zh": "你洗清了罪责，你吃得上好饭"}, {"t": 192.45, "en": "As long as the ticker goes up", "zh": "只要股价还涨"}, {"t": 196.72, "en": "Huang man Huang man there's no need to feel down", "zh": "黄老板，黄老板，不必感到沮丧"}, {"t": 200.41, "en": "Huang man Huang man pick it up off the ground", "zh": "黄老板，黄老板，把皮衣从地上捡起来"}, {"t": 203.97, "en": "N-V-D-A and just go to the N-V-D-A", "zh": "N-V-D-A，就去 N-V-D-A！"}];

const list = document.getElementById('list');
const v = document.getElementById('v');
const pos = document.getElementById('pos');

LYR.forEach((l, i) => {
  const d = document.createElement('div');
  d.className = 'line';
  d.dataset.i = i;
  const en = document.createElement('div');
  en.className = 'en';
  en.textContent = l.en;
  const zh = document.createElement('div');
  zh.className = 'zh';
  zh.textContent = l.zh || '';
  d.appendChild(en);
  d.appendChild(zh);
  d.addEventListener('click', () => { v.currentTime = l.t; v.play(); });
  list.appendChild(d);
});

const nodes = [...list.children];
let cur = -1;

function tick() {
  const t = v.currentTime;
  pos.textContent = fmt(t);
  let idx = -1;
  for (let i = 0; i < LYR.length; i++) {
    if (t + 0.08 >= LYR[i].t) idx = i; else break;
  }
  if (idx !== cur) {
    if (cur >= 0 && nodes[cur]) nodes[cur].classList.remove('on');
    if (idx >= 0 && nodes[idx]) {
      nodes[idx].classList.add('on');
      const el = nodes[idx];
      const target = el.offsetTop - list.clientHeight * 0.42 + el.offsetHeight * 0.5;
      list.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
    }
    cur = idx;
  }
}

function fmt(s) {
  s = Math.max(0, s | 0);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

v.addEventListener('timeupdate', tick);
v.addEventListener('seeked', tick);
v.addEventListener('loadedmetadata', () => {
  const d = v.duration;
  document.querySelector('.meta').innerHTML =
    '<span id="pos">0:00</span> / ' + fmt(d);
  tick();
});
tick();
</script>
</body>
</html>
